<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>きらめき情報処理帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#fff6f9;
  --bg-2:#ffeef5;
  --surface:#ffffff;
  --surface-2:#fff0f6;
  --border:#ffd9e6;
  --ink:#4a2c3a;
  --ink-soft:#8a5c72;
  --muted:#b58aa0;
  --primary:#ff6f9c;
  --primary-deep:#e0447a;
  --primary-ink:#ffffff;
  --accent:#a879e8;
  --accent-2:#ffc95c;
  --good:#39b787;
  --good-bg:#e3f8ef;
  --bad:#ef7a7a;
  --bad-bg:#fdeaea;
  --bad-ink:#d9556f;
  --shadow: 0 10px 28px -12px rgba(224,68,122,.28);
  --radius-lg: 26px;
  --radius-md: 18px;
  --radius-sm: 12px;
  color-scheme: light;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#241220;
    --bg-2:#2c1526;
    --surface:#33172c;
    --surface-2:#3b1a32;
    --border:#54263f;
    --ink:#ffeaf3;
    --ink-soft:#e6b8cf;
    --muted:#b98aa5;
    --primary:#ff8fb3;
    --primary-deep:#ffb0c9;
    --primary-ink:#3a1023;
    --accent:#c9a6ff;
    --accent-2:#ffd37a;
    --good:#5fd6a8;
    --good-bg:#123829;
    --bad:#ff9b9b;
    --bad-bg:#3a1717;
    --bad-ink:#ff9b9b;
    --shadow: 0 10px 28px -12px rgba(0,0,0,.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#241220;
  --bg-2:#2c1526;
  --surface:#33172c;
  --surface-2:#3b1a32;
  --border:#54263f;
  --ink:#ffeaf3;
  --ink-soft:#e6b8cf;
  --muted:#b98aa5;
  --primary:#ff8fb3;
  --primary-deep:#ffb0c9;
  --primary-ink:#3a1023;
  --accent:#c9a6ff;
  --accent-2:#ffd37a;
  --good:#5fd6a8;
  --good-bg:#123829;
  --bad:#ff9b9b;
  --bad-bg:#3a1717;
  --bad-ink:#ff9b9b;
  --shadow: 0 10px 28px -12px rgba(0,0,0,.55);
  color-scheme: dark;
}
*{box-sizing:border-box;}
[hidden]{display:none!important;}
html,body{height:100%;}
body{
  margin:0;
  background:
    radial-gradient(1200px 500px at 100% -10%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 60%),
    radial-gradient(900px 500px at -10% 0%, color-mix(in srgb, var(--primary) 14%, transparent), transparent 55%),
    var(--bg);
  color:var(--ink);
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-inline:16px;
  padding-block:14px;
  display:flex;
  justify-content:center;
}
.app{
  width:100%;
  max-width:480px;
  display:flex;
  flex-direction:column;
  min-height:calc(100% - 28px);
  padding-bottom:78px;
  position:relative;
}
h1,h2,h3{font-family:"Mochiy Pop One","Zen Maru Gothic",sans-serif;font-weight:400;text-wrap:balance;margin:0;}
button{font-family:inherit;}
::selection{background:color-mix(in srgb, var(--primary) 35%, transparent);}

/* ---- top bar ---- */
.topbar{
  display:flex;align-items:center;gap:10px;
  padding-block:6px 14px;
}
.topbar .back{
  width:38px;height:38px;border-radius:50%;border:1px solid var(--border);
  background:var(--surface);color:var(--primary-deep);font-size:18px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;
}
.topbar .back:focus-visible, button:focus-visible, .choice:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
.topbar .titles{flex:1;min-width:0;}
.topbar .titles .eyebrow{font-size:11px;color:var(--muted);letter-spacing:.06em;}
.topbar .titles h2{font-size:18px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar .emoji{font-size:24px;}

/* ---- home ---- */
.hero{
  background:linear-gradient(155deg, var(--primary), var(--accent));
  border-radius:var(--radius-lg);
  padding:22px 20px;
  color:#fff;
  box-shadow:var(--shadow);
  position:relative;
  overflow:hidden;
  margin-bottom:18px;
}
.hero::after{
  content:"✨";position:absolute;right:14px;top:10px;font-size:22px;opacity:.85;
}
.hero .brand{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.hero .brand .mark{font-size:26px;}
.hero .brand h1{font-size:20px;color:#fff;}
.hero .brand p{margin:2px 0 0;font-size:12px;opacity:.9;}
.hero-stats{display:flex;align-items:center;gap:16px;}
.ring{
  width:74px;height:74px;border-radius:50%;flex:none;
  background: conic-gradient(#fff var(--pct, 0%), rgba(255,255,255,.28) 0);
  display:flex;align-items:center;justify-content:center;
  transition:background 1s ease;
}
.ring .hole{
  width:58px;height:58px;border-radius:50%;background:color-mix(in srgb, var(--primary) 78%, var(--accent) 22%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;
}
.ring .hole b{font-size:17px;font-variant-numeric:tabular-nums;}
.ring .hole span{font-size:9px;opacity:.85;margin-top:2px;}
.hero-msg{font-size:13px;line-height:1.5;}
.hero-msg b{font-size:14.5px;display:block;margin-bottom:2px;}

.section-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px;}
.section-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
  padding:14px;text-align:left;cursor:pointer;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:8px;color:var(--ink);
}
.section-card .top{display:flex;align-items:center;gap:8px;}
.section-card .emoji{
  width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:19px;background:var(--surface-2);flex:none;
}
.section-card .tag{font-size:10.5px;color:var(--muted);letter-spacing:.03em;}
.section-card .name{font-size:13.5px;font-weight:700;line-height:1.35;}
.meter{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;}
.meter i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg, var(--primary), var(--accent));transition:width .6s ease;}
.section-card .pct{font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums;text-align:right;}

.block-title{font-size:13px;color:var(--ink-soft);margin:4px 2px 10px;display:flex;align-items:center;gap:6px;}

/* ---- section detail ---- */
.mode-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
  padding:16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;cursor:pointer;
  margin-bottom:12px;color:var(--ink);
}
.mode-card .ico{font-size:26px;width:48px;height:48px;border-radius:14px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;flex:none;}
.mode-card .txt h3{font-size:15px;margin-bottom:2px;}
.mode-card .txt p{margin:0;font-size:12px;color:var(--ink-soft);}
.mode-card .go{margin-left:auto;color:var(--primary-deep);font-size:18px;}
.stat-row{display:flex;gap:10px;margin-bottom:16px;}
.stat-tile{flex:1;background:var(--surface-2);border-radius:var(--radius-sm);padding:10px 12px;}
.stat-tile b{display:block;font-size:17px;font-variant-numeric:tabular-nums;}
.stat-tile span{font-size:10.5px;color:var(--ink-soft);}

/* ---- flashcards ---- */
.progress-line{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-soft);margin-bottom:10px;font-variant-numeric:tabular-nums;}
.progress-track{flex:1;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;}
.progress-track i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .35s ease;}

.flip-zone{perspective:1200px;margin-bottom:16px;}
.flip-card{
  min-height:280px;border-radius:var(--radius-lg);position:relative;cursor:pointer;
  transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.8,.2,1);
}
.flip-card.flipped{transform:rotateY(180deg);}
.face{
  position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--radius-lg);
  padding:26px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;
  box-shadow:var(--shadow);border:1px solid var(--border);
}
.face.front{background:linear-gradient(160deg,var(--surface),var(--surface-2));}
.face.back{background:linear-gradient(160deg, var(--primary), var(--accent));color:#fff;transform:rotateY(180deg);overflow-y:auto;}
.face .hint{font-size:11px;color:var(--muted);letter-spacing:.05em;}
.face.back .hint{color:rgba(255,255,255,.85);}
.face .term{font-family:"Mochiy Pop One",sans-serif;font-size:24px;line-height:1.4;}
.face .kana{font-size:12.5px;color:var(--ink-soft);}
.face.back .def{font-size:14.5px;line-height:1.7;}
.tap-note{text-align:center;font-size:11.5px;color:var(--muted);margin:-6px 0 16px;}

.swipe-row{display:flex;gap:10px;}
.swipe-btn{
  flex:1;padding:14px 8px;border-radius:99px;border:none;font-size:14px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.swipe-btn.again{background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--border);}
.swipe-btn.got{background:linear-gradient(90deg,var(--primary),var(--primary-deep));color:#fff;box-shadow:var(--shadow);}

/* ---- quiz ---- */
.quiz-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:20px 18px;box-shadow:var(--shadow);margin-bottom:14px;
}
.quiz-q{font-size:15.5px;line-height:1.7;white-space:pre-wrap;}
.quiz-q pre{
  background:var(--surface-2);border-radius:var(--radius-sm);padding:10px 12px;font-size:12.5px;
  overflow-x:auto;margin:10px 0 2px;border:1px solid var(--border);font-family:"SFMono-Regular",Consolas,monospace;
}
.choices{display:flex;flex-direction:column;gap:10px;margin-bottom:6px;}
.choice{
  text-align:left;padding:13px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--border);
  background:var(--surface);color:var(--ink);font-size:14px;line-height:1.5;cursor:pointer;
  display:flex;gap:10px;align-items:flex-start;
}
.choice .lbl{
  width:22px;height:22px;border-radius:50%;background:var(--surface-2);color:var(--ink-soft);
  font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px;
}
.choice:disabled{cursor:default;}
.choice.correct{background:var(--good-bg);border-color:var(--good);color:var(--ink);}
.choice.correct .lbl{background:var(--good);color:#fff;}
.choice.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--ink);}
.choice.wrong .lbl{background:var(--bad);color:#fff;}
.choice.dim{opacity:.55;}

.explain{
  margin-top:14px;border-radius:var(--radius-sm);padding:14px 15px;background:var(--surface-2);
  border:1px dashed var(--border);font-size:13.5px;line-height:1.75;color:var(--ink);
}
.explain b{color:var(--primary-deep);}
.feedback{font-family:"Mochiy Pop One",sans-serif;font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.feedback.is-good{color:var(--good);}
.feedback.is-bad{color:var(--bad-ink);}

.primary-btn{
  width:100%;padding:15px;border-radius:99px;border:none;background:linear-gradient(90deg,var(--primary),var(--primary-deep));
  color:#fff;font-size:15px;font-weight:700;cursor:pointer;box-shadow:var(--shadow);
}
.ghost-btn{
  width:100%;padding:14px;border-radius:99px;border:1.5px solid var(--border);background:var(--surface);
  color:var(--ink-soft);font-size:14px;font-weight:700;cursor:pointer;margin-top:10px;
}

/* ---- result ---- */
.result-wrap{text-align:center;padding:18px 6px;}
.result-ring{
  width:150px;height:150px;border-radius:50%;margin:8px auto 18px;
  background:conic-gradient(var(--primary) var(--pct,0%), var(--surface-2) 0);
  display:flex;align-items:center;justify-content:center;
}
.result-ring .hole{
  width:120px;height:120px;border-radius:50%;background:var(--surface);
  display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px var(--border);
}
.result-ring .hole b{font-size:30px;font-variant-numeric:tabular-nums;}
.result-ring .hole span{font-size:11px;color:var(--ink-soft);}
.result-title{font-size:19px;margin-bottom:6px;}
.result-sub{font-size:13px;color:var(--ink-soft);margin-bottom:20px;line-height:1.6;}

/* ---- review / records ---- */
.empty-state{text-align:center;padding:50px 20px;color:var(--ink-soft);}
.empty-state .big{font-size:38px;display:block;margin-bottom:10px;}
.weak-item{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:12px 14px;margin-bottom:10px;display:flex;gap:10px;align-items:center;
}
.weak-item .n{
  width:26px;height:26px;border-radius:8px;background:var(--bad-bg);color:#d9556f;font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;flex:none;
}
.weak-item .txt{flex:1;font-size:13px;line-height:1.5;}
.weak-item .txt .q{font-weight:700;margin-bottom:2px;}
.weak-item .txt .m{font-size:11px;color:var(--muted);}

.rec-row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:10px;}
.rec-row .emoji{font-size:20px;width:36px;height:36px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;flex:none;}
.rec-row .body{flex:1;min-width:0;}
.rec-row .body .t{font-size:12.5px;font-weight:700;margin-bottom:5px;}
.rec-row .num{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums;min-width:38px;text-align:right;}

/* ---- bottom nav ---- */
.bottom-nav{
  position:fixed;left:50%;transform:translateX(-50%);bottom:12px;
  width:calc(100% - 32px);max-width:448px;
  background:var(--surface);border:1px solid var(--border);border-radius:99px;
  display:flex;box-shadow:0 14px 30px -10px rgba(0,0,0,.25);
  padding:6px;gap:4px;
  padding-bottom:calc(6px + env(safe-area-inset-bottom, 0px));
}
.nav-btn{
  flex:1;border:none;background:transparent;padding:9px 4px;border-radius:99px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:10px;
}
.nav-btn .ic{font-size:18px;}
.nav-btn.active{background:linear-gradient(90deg,var(--primary),var(--accent));color:#fff;}
.nav-btn .badge{
  position:absolute;margin-left:14px;margin-top:-16px;background:var(--bad);color:#fff;font-size:9px;
  min-width:15px;height:15px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 3px;
}

.confirm-overlay{
  position:fixed;inset:0;background:rgba(30,10,20,.45);display:flex;align-items:center;justify-content:center;
  padding:24px;z-index:50;
}
.confirm-box{
  background:var(--surface);border-radius:var(--radius-md);padding:20px;max-width:320px;width:100%;
  box-shadow:var(--shadow);text-align:center;
}
.confirm-box p{font-size:13.5px;line-height:1.6;color:var(--ink-soft);margin:8px 0 16px;}
.confirm-row{display:flex;gap:8px;}
.confirm-row button{flex:1;padding:11px;border-radius:99px;border:1.5px solid var(--border);background:var(--surface-2);font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;}
.confirm-row button.danger{background:var(--bad);border-color:var(--bad);color:#fff;}

.settings-btn{
  position:absolute;right:0;top:14px;background:rgba(255,255,255,.25);border:none;width:32px;height:32px;border-radius:50%;
  color:#fff;font-size:15px;cursor:pointer;
}
</style>
</head>
<body>

<div class="app" id="app"></div>

<div class="bottom-nav" id="bottomNav">
  <button class="nav-btn" data-tab="home"><span class="ic">🏠</span>ホーム</button>
  <button class="nav-btn" data-tab="review"><span class="ic">💗</span>にがて復習</button>
  <button class="nav-btn" data-tab="records"><span class="ic">📔</span>きろく</button>
</div>

<script>
(function(){
"use strict";

/* ============================== DATA ============================== */

function cards(list){ return list.map(function(c,i){ return {idx:i, term:c[0], kana:c[1]||"", def:c[2]}; }); }

var SECTIONS = [
{
  id:1, title:"第1問", name:"ハードウェア・ソフトウェア", emoji:"💻",
  desc:"パソコンの部品やOS、ソフトの種類にまつわる用語",
  cards: cards([
    ["CPU","シーピーユー","コンピュータの頭脳にあたる部分。プログラムの命令を解読し、計算やデータ処理を行う装置。「中央処理装置」ともいう。"],
    ["レジスタ","","CPUの内部にある、演算中のデータを一時的に記憶する非常に高速な記憶回路。"],
    ["キャッシュメモリ","","CPUと主記憶装置(メモリ)の処理速度差を埋めるために置かれる、小容量で高速な記憶装置。"],
    ["GPU","ジーピーユー","画像処理を専門に行う処理装置。グラフィックスや3D描画、AIの計算などを高速に行う。"],
    ["SSD","エスエスディー","フラッシュメモリを使った補助記憶装置。HDDより読み書きが高速で、衝撃にも強い。"],
    ["RAID","レイド","複数のハードディスクを組み合わせて、信頼性や処理速度を高める技術。"],
    ["OCR","オーシーアール","手書きや印刷された文字を光学的に読み取り、コンピュータで扱えるデータに変換する装置。"],
    ["OMR","オーエムアール","マークシートなどの塗りつぶされた位置を光学的に読み取る装置。"],
    ["ドライバ","","周辺機器をOSが制御できるようにするための専用ソフトウェア。"],
    ["OS","オペレーティングシステム","ハードウェアとソフトウェアを管理し、コンピュータ全体を制御する基本ソフトウェア。"],
    ["フリーウェア","","無償で使用できるソフトウェア。著作権そのものは作者に残る。"],
    ["シェアウェア","","一定期間は無料で試用でき、継続して使うには対価の支払いが必要なソフトウェア。"],
    ["オープンソースソフトウェア","OSS","ソースコード(設計図)が公開され、誰でも改良・再配布できるソフトウェア。"],
    ["サブスクリプション","","一定期間ごとに料金を支払い、その間サービスやソフトを利用できる契約方式。"],
    ["Bluetooth","ブルートゥース","数メートル程度の近距離で機器同士を無線接続する通信規格。"],
    ["USB","ユーエスビー","パソコンと周辺機器を接続するための、標準的なインタフェース規格。"]
  ])
},
{
  id:2, title:"第2問", name:"通信ネットワーク・セキュリティ", emoji:"🌐",
  desc:"ネットワークのしくみと、情報モラル・セキュリティの用語",
  cards: cards([
    ["LAN","ラン","学校や会社など、比較的せまい範囲内でコンピュータ同士を接続するネットワーク。"],
    ["WAN","ワン","広い地域に分散したLAN同士を、通信回線で接続したより広範囲のネットワーク。"],
    ["Wi-Fi","ワイファイ","無線でLANに接続する技術の一般的な呼び名。"],
    ["IPアドレス","","ネットワーク上でコンピュータを識別するために割り振られる番号。"],
    ["ドメイン名","","IPアドレスを人にわかりやすい文字列で表したもの。"],
    ["プロトコル","","コンピュータ同士が通信するときの共通の約束事・手順。"],
    ["TCP/IP","","インターネットで標準的に使われる、通信プロトコルの集まり。"],

/* ============================== STATE / STORAGE ============================== */

var STORE_KEY = "zensho2_kirameki_v1";
function loadStore(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {mastered:{}, best:{}, weak:{}};
}
function saveStore(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }catch(e){}
}
var store = loadStore();
if(!store.mastered) store.mastered = {};
if(!store.best) store.best = {};
if(!store.weak) store.weak = {};

function masteredSet(sid){ return store.mastered[sid] || (store.mastered[sid]=[]); }
function isMastered(sid, idx){ return masteredSet(sid).indexOf(idx) !== -1; }
function markMastered(sid, idx){ var arr=masteredSet(sid); if(arr.indexOf(idx)===-1){ arr.push(idx); saveStore(); } }

function sectionById(id){ for(var i=0;i<SECTIONS.length;i++){ if(SECTIONS[i].id===id) return SECTIONS[i]; } return null; }

function bestPct(sid){ return store.best[sid] || 0; }
function setBestPct(sid, pct){ if(pct > bestPct(sid)){ store.best[sid]=pct; saveStore(); } }

function weakList(){
  var out = [];
  for(var k in store.weak){ if(Object.prototype.hasOwnProperty.call(store.weak,k)) out.push(store.weak[k]); }
  out.sort(function(a,b){ return (b.count||1)-(a.count||1); });
  return out;
}
function addWeak(item){
  var key = item.sid+":"+item.key;
  var prev = store.weak[key];
  store.weak[key] = {sid:item.sid, key:item.key, q:item.q, ch:item.ch, a:item.a, ex:item.ex, table:item.table||"", sname:item.sname, count:(prev?prev.count:0)+1};
  saveStore();
}
function removeWeak(sid, key){ var k = sid+":"+key; if(store.weak[k]){ delete store.weak[k]; saveStore(); } }

function sectionProgressPct(sec){
  var m = masteredSet(sec.id).length, total = sec.cards.length;
  var mp = total ? Math.round(m/total*100) : 0;
  var qp = bestPct(sec.id);
  return Math.max(mp, qp);
}
function overallPct(){
  var sum=0; for(var i=0;i<SECTIONS.length;i++) sum += sectionProgressPct(SECTIONS[i]);
  return Math.round(sum / SECTIONS.length);
}

/* ============================== QUIZ BUILDING ============================== */

function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}

// term-based auto quiz: build 4-choice questions from a card pool
function buildTermQuiz(sec){
  var pool = sec.cards;
  var order = shuffle(pool);
  return order.map(function(card){
    var dir = Math.random() < 0.5;
    var distractors = shuffle(pool.filter(function(c){return c.idx!==card.idx;})).slice(0,3);
    var options = shuffle([card].concat(distractors));
    var correctPos = options.indexOf(card);
    var qText, choices;
    if(dir){
      qText = "次の説明にあてはまる用語はどれか。\n「"+card.def+"」";
      choices = options.map(function(o){ return o.term + (o.kana && o.kana!=="公式カード" ? "("+o.kana+")" : ""); });
    }else{
      qText = "「"+card.term+"」の説明として正しいものはどれか。";
      choices = options.map(function(o){ return o.def; });
    }
    return {sid:sec.id, sname:sec.name, key:"term"+card.idx+(dir?"d":"t"), q:qText, ch:choices, a:correctPos,
      ex:"正解は「"+card.term+"」。"+card.def};
  });
}

function buildAuthoredQuiz(sec){
  return shuffle(sec.quiz).map(function(item, i){
    var opts = item.ch.map(function(t,idx){ return {t:t, orig:idx}; });
    var shuffled = shuffle(opts);
    var correctPos = shuffled.findIndex(function(o){ return o.orig===item.a; });
    return {sid:sec.id, sname:sec.name, key:"quiz"+i+"_"+item.q.slice(0,6), q:item.q, table:item.table||"", ch:shuffled.map(function(o){return o.t;}), a:correctPos, ex:item.ex};
  });
}

function buildQuizForSection(sec){
  var out = [];
  if(sec.cards && sec.cards.length && sec.cards[0].kana !== "公式カード"){
    out = out.concat(buildTermQuiz(sec));
  }
  if(sec.quiz && sec.quiz.length){ out = out.concat(buildAuthoredQuiz(sec)); }
  return shuffle(out);
}

/* ---------- Flashcards ---------- */
function startFlashcards(sec){
  view.fc = { sec:sec, queue: shuffle(sec.cards), pos:0, flipped:false, total: sec.cards.length, gotCount:0 };
  view.screen = "flashcard";
  render();
}
function renderFlashcard(){
  var st = view.fc;
  pendingBack = function(){ view.screen="section"; render(); };
  if(st.pos >= st.queue.length){
    var html = topbar(st.sec.title, st.sec.emoji);
    html += '<div class="result-wrap">'
      + '<div style="font-size:52px;">🌸✨</div>'
      + '<h2 class="result-title">全部めくったね!</h2>'
      + '<p class="result-sub">「覚えた」にしたカード: '+st.gotCount+' / '+st.total+'<br>むずかしかった用語は、クイズでもう一度チェックしてみよう。</p>'
      + '<button class="primary-btn" id="toQuiz">✏️ クイズに挑戦する</button>'
      + '<button class="ghost-btn" id="toSection">大問メニューに戻る</button>'
      + '</div>';
    app.innerHTML = html;
    bindTopbarBack();
    document.getElementById("toQuiz").addEventListener("click", function(){ startQuiz(st.sec, null); });
    document.getElementById("toSection").addEventListener("click", function(){ view.screen="section"; render(); });
    return;
  }
  var card = st.queue[st.pos];
  var isFormula = card.kana === "公式カード";
  var pct = Math.round(st.pos/st.queue.length*100);
  var html = topbar(st.sec.title+" 暗記カード", st.sec.emoji);
  html += '<div class="progress-line"><span>'+(st.pos+1)+' / '+st.queue.length+'</span><div class="progress-track"><i style="width:'+pct+'%"></i></div></div>';
  html += '<div class="flip-zone"><div class="flip-card'+(st.flipped?" flipped":"")+'" id="flipCard">'
    + '<div class="face front"><div class="hint">'+(isFormula?"公式":"よう語")+'</div><div class="term">'+esc(card.term)+'</div>'
    + (card.kana && !isFormula ? '<div class="kana">'+esc(card.kana)+'</div>' : '')
    + '</div>'
    + '<div class="face back"><div class="hint">'+(isFormula?"つかいかた":"いみ")+'</div><div class="def">'+nl2br(card.def)+'</div></div>'
    + '</div></div>';
  html += '<p class="tap-note">タップしてめくる</p>';
  html += '<div class="swipe-row">'
    + '<button class="swipe-btn again" id="btnAgain">😵 もう一回</button>'
    + '<button class="swipe-btn got" id="btnGot">🌸 覚えた!</button>'
    + '</div>';
  app.innerHTML = html;
  bindTopbarBack();
  document.getElementById("flipCard").addEventListener("click", function(){ st.flipped = !st.flipped; render(); });
  document.getElementById("btnAgain").addEventListener("click", function(){
    var c = st.queue.splice(st.pos,1)[0];
    st.queue.push(c);
    st.flipped=false;
    render();
  });
  document.getElementById("btnGot").addEventListener("click", function(){
    markMastered(st.sec.id, card.idx);
    st.gotCount++;
    st.pos++; st.flipped=false;
    render();
  });
}

/* ---------- Quiz ---------- */
function startQuiz(sec, customQuestions){
  var qs = customQuestions ? customQuestions : buildQuizForSection(sec);
  view.qz = { sec:sec, questions:qs, pos:0, score:0, answered:false, pickedIdx:null, isReview: !!customQuestions };
  view.screen = "quiz";
  render();
}
function renderQuiz(){
  var st = view.qz;
  pendingBack = function(){ view.screen = st.isReview ? "review" : "section"; render(); };
  if(st.pos >= st.questions.length){
    var pct = st.questions.length ? Math.round(st.score/st.questions.length*100) : 0;
    if(!st.isReview) setBestPct(st.sec.id, pct);
    var tier = pct>=90 ? ["💯","パーフェクト!","この大問はもうバッチリだね"] :
      pct>=70 ? ["🎉","すごい!あと少し!","にがてなところだけ復習しよう"] :
      pct>=50 ? ["🌱","いいかんじ!","にがて復習で伸びしろをつぶそう"] :
      ["🍀","だいじょうぶ、これからのびる","暗記カードでもう一周してみよう"];
    var html = topbar((st.isReview?"にがて復習":st.sec.title)+" 結果", st.isReview?"💗":st.sec.emoji);
    html += '<div class="result-wrap">'
      + '<div style="font-size:44px;">'+tier[0]+'</div>'
      + '<div class="result-ring" style="--pct:'+pct+'%"><div class="hole"><b>'+pct+'%</b><span>'+st.score+' / '+st.questions.length+'問正解</span></div></div>'
      + '<h2 class="result-title">'+tier[1]+'</h2>'
      + '<p class="result-sub">'+tier[2]+'</p>'
      + '<button class="primary-btn" id="retryBtn">もう一度挑戦する</button>'
      + '<button class="ghost-btn" id="homeBtn">ホームにもどる</button>'
      + '</div>';
    app.innerHTML = html;
    bindTopbarBack();
    document.getElementById("retryBtn").addEventListener("click", function(){
      if(st.isReview) startReviewQuiz(); else startQuiz(st.sec, null);
    });
    document.getElementById("homeBtn").addEventListener("click", function(){ setTab("home"); });
    return;
  }
  var q = st.questions[st.pos];
  var pct = Math.round(st.pos/st.questions.length*100);
  var labels = ["A","B","C","D"];
  var html = topbar((st.isReview?"にがて復習":st.sec.title)+" クイズ", st.isReview?"💗":st.sec.emoji);
  html += '<div class="progress-line"><span>問題 '+(st.pos+1)+' / '+st.questions.length+'</span><div class="progress-track"><i style="width:'+pct+'%"></i></div><span>正解 '+st.score+'</span></div>';
  html += '<div class="quiz-card">';
  html += '<div class="quiz-q">'+nl2br(q.q)+(q.table?'<pre>'+esc(q.table)+'</pre>':'')+'</div>';
  html += '</div>';
  html += '<div class="choices" id="choicesWrap">';
  q.ch.forEach(function(c, i){
    html += '<button class="choice" data-i="'+i+'"><span class="lbl">'+labels[i]+'</span><span>'+esc(c)+'</span></button>';
  });
  html += '</div>';
  html += '<div id="explainWrap"></div>';
  app.innerHTML = html;
  bindTopbarBack();
  app.querySelectorAll(".choice").forEach(function(btn){
    btn.addEventListener("click", function(){ pickAnswer(parseInt(btn.getAttribute("data-i"),10)); });
  });
}
function pickAnswer(i){
  var st = view.qz;
  if(st.answered) return;
  st.answered = true; st.pickedIdx = i;
  var q = st.questions[st.pos];
  var correct = i === q.a;
  if(correct){ st.score++; if(st.isReview) removeWeak(q.sid, q.key); }
  else { addWeak({sid:q.sid, sname:q.sname, key:q.key, q:q.q, ch:q.ch, a:q.a, ex:q.ex, table:q.table}); }

  document.querySelectorAll(".choice").forEach(function(btn, idx){
    btn.disabled = true;
    if(idx === q.a) btn.classList.add("correct");
    else if(idx === i) btn.classList.add("wrong");
    else btn.classList.add("dim");
  });
  var ex = document.getElementById("explainWrap");
  ex.innerHTML = '<div class="explain">'
    + '<div class="feedback '+(correct?"is-good":"is-bad")+'">'+(correct?"🌸 せいかい!":"💦 おしい、正解は "+String.fromCharCode(65+q.a))+'</div>'
    + '<div>'+q.ex+'</div>'
    + '</div>'
    + '<button class="primary-btn" id="nextBtn" style="margin-top:14px;">'+(st.pos+1<st.questions.length?"つぎの問題へ":"けっかを見る")+'</button>';
  document.getElementById("nextBtn").addEventListener("click", function(){ st.pos++; st.answered=false; st.pickedIdx=null; render(); });
  ex.scrollIntoView({behavior:"smooth", block:"nearest"});
}

  var items = weakList();

  startQuiz(null, qs);
}

  var items = weakList();

  html += '<button class="primary-btn" id="startReview" style="margin-bottom:18px;">💪 にがてクイズに挑戦する('+items.length+'問)</button>';
  items.forEach(function(w, i){
    html += '<div class="weak-item"><div class="n">'+(w.count>1?"×"+w.count:"!")+'</div><div class="txt"><div class="q">'+esc(w.q.slice(0,42))+(w.q.length>42?"…":"")+'</div><div class="m">'+esc(w.sname||"")+'</div></div></div>';
  });
  app.innerHTML = html;

}

/* ---------- Records (きろく) ---------- */
function renderRecords(){
  var html = '<div class="topbar"><div class="emoji">📔</div><div class="titles"><h2>きろく</h2></div>'
    + '<button class="back" id="resetBtn" title="記録をリセット" style="margin-left:auto;">⚙️</button></div>';
  var totalMastered = 0, totalCards = 0;
  SECTIONS.forEach(function(s){ totalMastered += masteredSet(s.id).length; totalCards += s.cards.length; });
  html += '<div class="stat-row">'
    + '<div class="stat-tile"><b>'+overallPct()+'%</b><span>ぜんたい進捗</span></div>'
    + '<div class="stat-tile"><b>'+totalMastered+' / '+totalCards+'</b><span>覚えたカード</span></div>'
    + '<div class="stat-tile"><b>'+weakList().length+'</b><span>にがて問題</span></div>'
    + '</div>';
  html += '<div class="block-title">📊 大問べつスコア</div>';
  SECTIONS.forEach(function(sec){
    var m = masteredSet(sec.id).length;
    html += '<div class="rec-row"><div class="emoji">'+sec.emoji+'</div><div class="body"><div class="t">'+sec.title+' '+esc(sec.name)+'</div>'
      + '<div class="meter"><i style="width:'+sectionProgressPct(sec)+'%"></i></div></div>'
      + '<div class="num">'+sectionProgressPct(sec)+'%</div></div>';
  });
  app.innerHTML = html;
  document.getElementById("resetBtn").addEventListener("click", showResetConfirm);
}

function showResetConfirm(){
  var ov = document.createElement("div");
  ov.className = "confirm-overlay";
  ov.innerHTML = '<div class="confirm-box"><h3 style="font-size:16px;">記録をリセットする?</h3>'
    + '<p>覚えたカード・スコア・にがてリストが全部消えるよ。もとには戻せません。</p>'
    + '<div class="confirm-row"><button id="cancelReset">やめる</button><button class="danger" id="doReset">リセットする</button></div></div>';
  document.body.appendChild(ov);
  document.getElementById("cancelReset").addEventListener("click", function(){ ov.remove(); });
  document.getElementById("doReset").addEventListener("click", function(){
    store = {mastered:{}, best:{}, weak:{}};
    saveStore();
    ov.remove();
    renderRecords();
  });
}

/* ---------- Router ---------- */
function render(){
  bottomNav.querySelectorAll(".nav-btn").forEach(function(btn){
    var t = btn.getAttribute("data-tab");
    var active = (t==="home" && ["home","section","flashcard","quiz","result"].indexOf(view.screen)!==-1 && view.tab==="home")
      || (t===view.tab);
    btn.classList.toggle("active", t===view.tab);
    var badge = btn.querySelector(".badge"); if(badge) badge.remove();
    if(t==="review"){
      var n = weakList().length;
      if(n>0){ var b=document.createElement("span"); b.className="badge"; b.textContent=n>99?"99+":n; btn.style.position="relative"; btn.appendChild(b); }
    }
  });
  window.scrollTo(0,0);
  if(view.screen==="home") renderHome();
  else if(view.screen==="section") renderSection();
  else if(view.screen==="flashcard") renderFlashcard();
  else if(view.screen==="quiz") renderQuiz();
  else if(view.tab==="review") renderReview();
  else if(view.tab==="records") renderRecords();
}

bottomNav.querySelectorAll(".nav-btn").forEach(function(btn){
  btn.addEventListener("click", function(){ setTab(btn.getAttribute("data-tab")); });
});

/* ---------- boot ---------- */
function boot(data){
  render();
}
if(window.claude && window.claude.hot){
  window.claude.hot.ready ? window.claude.hot.ready(boot) : boot(window.claude.hot.data || {});
} else {
  boot({});
}
})();
</script>
</body>
</html>
